name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actions-lock-verify:
    permissions:
      contents: read # checkout repository to verify actions.lock
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.8.0

  ci:
    permissions:
      contents: read # checkout repository for Python uv CI
    uses: berquerant/reusable-workflows/.github/workflows/python-uv-ci.yml@v0.8.0
    with:
      python-version: "3.14"
      command: make ci
